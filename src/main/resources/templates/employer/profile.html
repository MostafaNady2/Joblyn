<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Company & Profile — Joblyn</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;1,600&family=Source+Sans+3:wght@400;500;600;700&display=swap"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<!-- ===== Navbar ===== -->
<nav class="navbar navbar-expand-lg rj-navbar py-2">
    <div class="container">

        <!-- Left side - Project name -->
        <a class="navbar-brand text-white fw-bold fs-4 text-decoration-none"
           th:href="@{/}">
            Joblyn
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item"><a class="nav-link active" th:href="@{/employer/dashboard}">My dashboard</a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-3">
                <a th:href="@{/employer/profile}" class="text-decoration-none">
                    <img th:if="${employerProfile?.profilePhoto != null and !#strings.isEmpty(employerProfile.profilePhoto)}"
                         th:src="@{${image}}"
                         alt="Profile Photo"
                         class="rounded-circle border border-2 border-light"
                         width="38"
                         height="38"
                         style="object-fit: cover;">

                    <div th:unless="${employerProfile?.profilePhoto != null and !#strings.isEmpty(employerProfile.profilePhoto)}"
                         class="rounded-circle bg-secondary-subtle d-inline-flex align-items-center justify-content-center border border-2 border-light"
                         style="width: 38px; height: 38px;">
                        <i class="bi bi-building text-dark fs-5"></i>
                    </div>
                </a>
            </div>
        </div>
    </div>
</nav>

<section class="container py-5">
    <div class="dash-shell">

        <!-- Sidebar Navigation -->
        <aside class="dash-side">
            <!-- Profile / Company Photo Avatar -->
            <div class="mb-3 text-center text-md-start">
                <img th:if="${employerProfile?.profilePhoto != null and !#strings.isEmpty(employerProfile.profilePhoto)}"
                     th:src="@{${image}}"
                     alt="Profile Photo"
                     class="rounded-circle border"
                     width="72"
                     height="72"
                     style="object-fit: cover;">
                <div th:unless="${employerProfile?.profilePhoto != null and !#strings.isEmpty(employerProfile.profilePhoto)}"
                     class="rounded-circle bg-light d-inline-flex align-items-center justify-content-center border"
                     style="width: 72px; height: 72px;">
                    <i class="bi bi-building text-secondary fs-2"></i>
                </div>
            </div>

            <span class="who">Signed in as</span>
            <div class="name"
                 th:text="${employerProfile?.companyName != null ? employerProfile.companyName : 'Employer'}">
                Company Name
            </div>

            <ul class="nav flex-column mt-3">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/employer/dashboard}">
                        <i class="bi bi-grid me-2"></i> Overview
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/employer/jobs/new}">
                        <i class="bi bi-plus-circle me-2"></i> Post a job
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/employer/profile}">
                        <i class="bi bi-person me-2"></i> Profile
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/employer/jobs}">
                        <i class="bi bi-briefcase me-2"></i> My listings
                    </a>
                </li>
            </ul>

            <hr>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="nav-link border-0 bg-transparent p-0 text-start w-100">
                    <i class="bi bi-box-arrow-right me-2"></i> Log out
                </button>
            </form>
        </aside>

        <!-- Main Content -->
        <div>
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div>
                    <h1 class="h3 mb-1">Company Profile</h1>
                    <p class="text-muted mb-0">Update your account holder details, company info, and location.</p>
                </div>
            </div>

            <div id="profile" class="panel">
                <form th:action="@{/employer/profile}" th:object="${employerProfile}" method="post"
                      enctype="multipart/form-data">

                    <input type="hidden" th:field="*{profilePhoto}">

                    <div class="row g-3">
                        <!-- Company Name -->
                        <div class="col-12">
                            <label class="form-label" for="companyName">Company name</label>
                            <input type="text" id="companyName" th:field="*{companyName}" class="form-control" required>
                        </div>

                        <!-- First Name -->
                        <div class="col-md-6">
                            <label class="form-label" for="firstName">Contact First name</label>
                            <input type="text" id="firstName" th:field="*{firstName}" class="form-control" required>
                        </div>

                        <!-- Last Name -->
                        <div class="col-md-6">
                            <label class="form-label" for="lastName">Contact Last name</label>
                            <input type="text" id="lastName" th:field="*{lastName}" class="form-control" required>
                        </div>

                        <!-- City -->
                        <div class="col-md-6">
                            <label class="form-label" for="city">City</label>
                            <input type="text" id="city" th:field="*{city}" class="form-control">
                        </div>

                        <!-- Country -->
                        <div class="col-md-6">
                            <label class="form-label" for="country">Country</label>
                            <input type="text" id="country" th:field="*{country}" class="form-control">
                        </div>

                        <!-- Company Logo / Profile Photo Upload -->
                        <div class="col-12">
                            <label class="form-label" for="photoFile">Company Logo / Photo</label>
                            <input type="file" id="photoFile" name="photoFile" class="form-control" accept="image/*">
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-3 mt-4 border-top">
                        <a th:href="@{/employer/dashboard}" class="btn btn-outline-ink btn-sm">Cancel</a>
                        <button type="submit" class="btn btn-brass btn-sm">
                            <i class="bi bi-check-circle me-1"></i> Save changes
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </div>
</section>

<div th:replace="fragments/footer :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
