<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Post a Job — Joblyn</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;1,600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<!-- ===== Navbar ===== -->
<nav class="navbar navbar-expand-lg rj-navbar py-2">
    <div class="container">

        <!-- Left side - Project name -->
        <a class="navbar-brand text-white fw-bold fs-4 text-decoration-none"
           th:href="@{/}">
            Joblyn
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item"><a class="nav-link active" th:href="@{/employer/dashboard}">My dashboard</a></li>
            </ul>
            <div class="d-flex align-items-center gap-3">
                <a th:href="@{/employer/profile}" class="text-decoration-none">
                    <img th:if="${employerProfile?.profilePhoto != null and !#strings.isEmpty(employerProfile.profilePhoto)}"
                         th:src="@{${image}}"
                         alt="Profile Photo"
                         class="rounded-circle border border-2 border-light"
                         width="38"
                         height="38"
                         style="object-fit: cover;">

                    <div th:unless="${employerProfile?.profilePhoto != null and !#strings.isEmpty(employerProfile.profilePhoto)}"
                         class="rounded-circle bg-secondary-subtle d-inline-flex align-items-center justify-content-center border border-2 border-light"
                         style="width: 38px; height: 38px;">
                        <i class="bi bi-building text-dark fs-5"></i>
                    </div>
                </a>
            </div>
        </div>
    </div>
</nav>

<section class="container py-5">
    <div class="dash-shell">

        <!-- Sidebar Navigation -->
        <aside class="dash-side">
            <!-- Profile / Company Photo Avatar -->
            <div class="mb-3 text-center text-md-start">
                <img th:if="${employerProfile?.profilePhoto != null and !#strings.isEmpty(employerProfile.profilePhoto)}"
                     th:src="@{${image}}"
                     alt="Profile Photo"
                     class="rounded-circle border"
                     width="72"
                     height="72"
                     style="object-fit: cover;">
                <div th:unless="${employerProfile?.profilePhoto != null and !#strings.isEmpty(employerProfile.profilePhoto)}"
                     class="rounded-circle bg-light d-inline-flex align-items-center justify-content-center border"
                     style="width: 72px; height: 72px;">
                    <i class="bi bi-building text-secondary fs-2"></i>
                </div>
            </div>

            <span class="who">Posting as</span>
            <div class="name" th:text="${companyName != null ? companyName : 'Company'}">Company Name</div>

            <ul class="nav flex-column mt-3">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/employer/dashboard}">
                        <i class="bi bi-grid me-2"></i> Overview
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/employer/jobs/new}">
                        <i class="bi bi-plus-circle me-2"></i> Post a job
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/employer/profile}">
                        <i class="bi bi-person me-2"></i> Profile
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/employer/jobs}">
                        <i class="bi bi-briefcase me-2"></i> My listings
                    </a>
                </li>
            </ul>

            <hr>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="nav-link border-0 bg-transparent p-0 text-start w-100">
                    <i class="bi bi-box-arrow-right me-2"></i> Log out
                </button>
            </form>
        </aside>

        <!-- Main Content -->
        <div>
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div>
                    <h1 class="h3 mb-1">Post a new job</h1>
                    <p class="text-muted mb-0">Fill out the details below to submit your job listing for review.</p>
                </div>
            </div>

            <!-- Job Form Panel -->
            <div class="panel">
                <form th:action="@{/employer/jobs/new}" th:object="${job}" method="post">

                    <!-- Job Title -->
                    <div class="mb-4">
                        <label for="title" class="form-label">Job Title</label>
                        <input type="text" id="title" th:field="*{title}" class="form-control"
                               placeholder="e.g. Senior Backend Engineer" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('title')}"
                             th:errors="*{title}"></div>
                    </div>

                    <div class="row g-3 mb-4">
                        <!-- Work Nature -->
                        <div class="col-md-6">
                            <label for="workNature" class="form-label">Work Nature</label>
                            <select id="workNature" th:field="*{workNature}" class="form-select" required>
                                <option value="" disabled selected>Select work nature</option>
                                <option th:each="nature : ${T(com.example.jobboard.enums.JobWorkNature).values()}"
                                        th:value="${nature}"
                                        th:text="${#strings.capitalize(#strings.toLowerCase(nature.name()))}">
                                    Full-time
                                </option>
                            </select>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('workNature')}"
                                 th:errors="*{workNature}"></div>
                        </div>

                        <!-- Salary -->
                        <div class="col-md-6">
                            <label for="salary" class="form-label">Salary (USD/yr)</label>
                            <input type="number" step="0.01" id="salary" th:field="*{salary}" class="form-control"
                                   placeholder="e.g. 85000.00">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('salary')}"
                                 th:errors="*{salary}"></div>
                        </div>
                    </div>

                    <!-- Embedded Location -->
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="locationCity" class="form-label">City</label>
                            <input type="text" id="locationCity" th:field="*{location.city}" class="form-control"
                                   placeholder="e.g. Cairo">
                        </div>
                        <div class="col-md-6">
                            <label for="locationCountry" class="form-label">Country</label>
                            <input type="text" id="locationCountry" th:field="*{location.country}" class="form-control"
                                   placeholder="e.g. Egypt">
                        </div>
                    </div>

                    <!-- Application Deadline -->
                    <div class="mb-4">
                        <label for="deadline" class="form-label">Application Deadline</label>
                        <input type="datetime-local" id="deadline" th:field="*{deadline}" class="form-control">
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('deadline')}"
                             th:errors="*{deadline}"></div>
                    </div>

                    <!-- Required Skills Section -->
                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <label class="form-label mb-0">Required Skills</label>
                            <button type="button" class="btn btn-outline-ink btn-sm" onclick="addSkillRow()">
                                <i class="bi bi-plus-lg me-1"></i> Add Skill
                            </button>
                        </div>
                        <div id="skillsContainer">
                            <div class="row g-2 mb-2 skill-row">
                                <div class="col-md-7">
                                    <input type="text" name="skills[0].skillName" class="form-control"
                                           placeholder="Skill name (e.g. Java)" required>
                                </div>
                                <div class="col-md-4">
                                    <select id="firstSkillLevelSelect" name="skills[0].requiredLevel"
                                            class="form-select"
                                            required>
                                        <option value="" disabled selected>Required level</option>
                                        <option th:each="level : ${T(com.example.jobboard.enums.SkillLevel).values()}"
                                                th:value="${level}"
                                                th:text="${#strings.capitalize(#strings.toLowerCase(level.name()))}">
                                            Senior
                                        </option>
                                    </select>
                                </div>
                                <div class="col-md-1 d-flex align-items-center">
                                    <button type="button" class="btn btn-outline-danger btn-sm w-100"
                                            onclick="removeSkillRow(this)">
                                        <i class="bi bi-x-lg"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Job Description -->
                    <div class="mb-4">
                        <label for="description" class="form-label">Job Description</label>
                        <textarea id="description" th:field="*{description}" class="form-control" rows="6"
                                  placeholder="Describe key responsibilities, qualifications, and benefits..."></textarea>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('description')}"
                             th:errors="*{description}"></div>
                    </div>

                    <!-- Form Actions -->
                    <div class="d-flex justify-content-end gap-2 pt-2 border-top">
                        <a th:href="@{/employer/dashboard}" class="btn btn-outline-ink btn-sm">Cancel</a>
                        <button type="submit" class="btn btn-brass btn-sm">
                            <i class="bi bi-check-circle me-1"></i> Submit for review
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>

<div th:replace="fragments/footer :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/script.js}"></script>
<script>
    let skillIndex = 1;

    function addSkillRow() {
        const container = document.getElementById('skillsContainer');
        const firstSelect = document.getElementById('firstSkillLevelSelect');
        const optionsHtml = firstSelect ? firstSelect.innerHTML : '';

        const row = document.createElement('div');
        row.className = 'row g-2 mb-2 skill-row';
        row.innerHTML = `
            <div class="col-md-7">
                <input type="text" name="skills[${skillIndex}].skillName" class="form-control" placeholder="Skill name" required>
            </div>
            <div class="col-md-4">
                <select name="skills[${skillIndex}].requiredLevel" class="form-select" required>
                    ${optionsHtml}
                </select>
            </div>
            <div class="col-md-1 d-flex align-items-center">
                <button type="button" class="btn btn-outline-danger btn-sm w-100" onclick="removeSkillRow(this)">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
        `;
        container.appendChild(row);
        skillIndex++;
    }

    function removeSkillRow(btn) {
        const rows = document.querySelectorAll('.skill-row');
        if (rows.length > 1) {
            btn.closest('.skill-row').remove();
        }
    }
</script>
</body>
</html>
