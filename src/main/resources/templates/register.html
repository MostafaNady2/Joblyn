<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create an account — Joblyn</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;1,600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<!-- ===== Navbar ===== -->
<nav class="navbar navbar-expand-lg rj-navbar py-2">
    <div class="container">

        <!-- Left side - Project name -->
        <a class="navbar-brand text-white fw-bold fs-4 text-decoration-none"
           th:href="@{/}">
            Joblyn
        </a>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="panel p-4">
                <div class="text-center mb-4">
                    <h1 class="h3 mb-1">Create an account</h1>
                    <p class="text-muted small mb-0">Join Joblyn as a candidate or employer</p>
                </div>

                <form th:action="@{/register}" th:object="${userForm}" method="post" novalidate>
                   <!-- Role picker -->
                    <label class="form-label d-block mb-2">I'm joining as a</label>
                    <div class="role-pick mb-4">
                        <input type="radio" th:field="*{role}" id="roleCandidate" value="CANDIDATE">
                        <label for="roleCandidate">
                            <i class="bi bi-person-badge d-block mb-1"></i>
                            Candidate
                        </label>

                        <input type="radio" th:field="*{role}" id="roleEmployer" value="EMPLOYER">
                        <label for="roleEmployer">
                            <i class="bi bi-briefcase d-block mb-1"></i>
                            Employer
                        </label>
                        <div class="text-danger small" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label" for="firstName">First name</label>
                            <input type="text" class="form-control" id="firstName" th:field="*{firstName}" >
                            <div class="text-danger small" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label" for="lastName">Last name</label>
                            <input type="text" class="form-control" id="lastName" th:field="*{lastName}" >
                            <div class="text-danger small" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                        </div>
                    </div>

                    <!-- Employer only fields -->
                    <div id="employerOnlyFields" class="d-none">
                        <div class="mb-3">
                            <label class="form-label" for="companyName">Company name</label>
                            <input type="text" class="form-control" id="companyName" th:field="*{companyName}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}"></div>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label" for="country">Country</label>
                                <input type="text" class="form-control" id="country" th:field="*{country}">
                                <div class="text-danger small" th:if="${#fields.hasErrors('country')}" th:errors="*{country}"></div>
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label" for="city">City</label>
                                <input type="text" class="form-control" id="city" th:field="*{city}">
                                <div class="text-danger small" th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></div>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="email">Email</label>
                        <input type="email" class="form-control" id="email" th:field="*{email}" >
                        <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label" for="password">Password</label>
                        <input type="password" class="form-control" id="password" th:field="*{password}" >
                        <div class="text-danger small" th:if="${#fields.hasErrors('password')}"
                             th:errors="*{password}"></div>
                    </div>

                    <button type="submit" class="btn btn-brass w-100 mb-3">Create account</button>
                </form>

                <p class="text-center text-muted small mb-0">
                    Already have an account? <a th:href="@{/login}">Log in</a>
                </p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
