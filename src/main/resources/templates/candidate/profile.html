<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Profile &amp; Resume — Joblyn</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;1,600&family=Source+Sans+3:wght@400;500;600;700&display=swap"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<!-- ===== Navbar ===== -->
<nav class="navbar navbar-expand-lg rj-navbar py-2">
    <div class="container">

        <!-- shared -->
        <!-- Left side - Project name -->
        <a class="navbar-brand text-white fw-bold fs-4 text-decoration-none"
           th:href="@{/}">
            Joblyn
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>


        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item"><a class="nav-link active" th:href="@{/candidate/profile}">dashboard</a></li>
            </ul>
            <div class="d-flex align-items-center gap-3">
                <!-- Candidate Avatar Replacement for Badge -->
                <a th:href="@{/candidate/profile}" class="text-decoration-none">
                    <img th:if="${profile.profilePhoto != null and !#strings.isEmpty(profile.profilePhoto)}"
                         th:src="@{${image}}"
                         alt="Profile Photo"
                         class="rounded-circle border border-2 border-light"
                         width="38"
                         height="38"
                         style="object-fit: cover;">

                    <div th:unless="${profile.profilePhoto != null and !#strings.isEmpty(profile.profilePhoto)}"
                         class="rounded-circle bg-secondary-subtle d-inline-flex align-items-center justify-content-center border border-2 border-light"
                         style="width: 38px; height: 38px;">
                        <i class="bi bi-person-fill text-dark fs-5"></i>
                    </div>
                </a>
            </div>
        </div>
    </div>
</nav>

<section class="container py-5">
    <div class="dash-shell">

        <!-- Sidebar Navigation -->
        <aside class="dash-side">
            <!-- Profile Photo Avatar -->
            <div class="mb-3 text-center text-md-start">
                <img th:if="${profile.profilePhoto != null and !#strings.isEmpty(profile.profilePhoto)}"
                     th:src="@{${image}}"
                     alt="Profile Photo"
                     class="rounded-circle border"
                     width="72"
                     height="72"
                     style="object-fit: cover;">
                <div th:unless="${profile.profilePhoto != null and !#strings.isEmpty(profile.profilePhoto)}"
                     class="rounded-circle bg-light d-inline-flex align-items-center justify-content-center border"
                     style="width: 72px; height: 72px;">
                    <i class="bi bi-person text-secondary fs-2"></i>
                </div>
            </div>

            <span class="who">Signed in as</span>
            <div class="name"
                 th:text="${profile.firstName + ' ' + profile.lastName}">
                User Name
            </div>

            <ul class="nav flex-column mt-3">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/candidate/dashboard}">
                        <i class="bi bi-grid me-2"></i> Overview
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/candidate/applications}">
                        <i class="bi bi-file-earmark-text me-2"></i> My applications
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/candidate/profile}">
                        <i class="bi bi-person me-2"></i> Profile &amp; resume
                    </a>
                </li>
                <!-- Resume Link item using standard Bootstrap Icon -->
                <li class="nav-item" th:if="${profile.resume != null and !#strings.isEmpty(profile.resume)}">
                    <a class="nav-link"
                       th:href="@{'/resumes/candidate/' + ${profile.id} + '/' + ${profile.resume}}"
                       target="_blank">
                        <i class="bi bi-file-earmark-person me-2"></i> Resume
                    </a>
                </li>
            </ul>

            <hr>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="nav-link border-0 bg-transparent p-0 text-start w-100">
                    <i class="bi bi-box-arrow-right me-2"></i> Log out
                </button>
            </form>
        </aside>

        <!-- Main Content -->
        <div>
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div>
                    <h1 class="h3 mb-1">Profile &amp; resume</h1>
                    <p class="text-muted mb-0">Manage your contact details, resume, and technical skills.</p>
                </div>
            </div>

            <div id="profile" class="panel">
                <form th:action="@{/candidate/profile}" th:object="${candidateProfile}" method="post"
                      enctype="multipart/form-data">


                    <div class="row g-3">
                        <!-- First Name -->
                        <div class="col-md-6">
                            <label class="form-label" for="firstName">First name</label>
                            <input type="text" id="firstName" th:field="*{firstName}" class="form-control" required>
                        </div>

                        <!-- Last Name -->
                        <div class="col-md-6">
                            <label class="form-label" for="lastName">Last name</label>
                            <input type="text" id="lastName" th:field="*{lastName}" class="form-control" required>
                        </div>

                        <!-- Preferred Work Type -->
                        <div class="col-md-6">
                            <label class="form-label" for="workType">Preferred work type</label>
                            <select id="workType" th:field="*{workType}" class="form-select" required>
                                <option th:each="wt : ${T(com.example.jobboard.enums.CandidateWorkType).values()}"
                                        th:value="${wt}"
                                        th:text="${#strings.capitalize(#strings.toLowerCase(#strings.replace(wt.name(), '_', ' ')))}">
                                    Work Type
                                </option>
                            </select>
                        </div>

                        <!-- Profile Photo Upload -->
                        <div class="col-md-6">
                            <label class="form-label" for="photoFile">Profile photo</label>
                            <input type="file" id="photoFile" name="profilePhoto" class="form-control" accept="image/*">
                        </div>

                        <!-- Resume Upload -->
                        <div class="col-md-12">
                            <label class="form-label" for="resumeFile">Resume</label>
                            <input type="file" id="resumeFile" name="resume" class="form-control"
                                   accept=".pdf,.doc,.docx">
                        </div>

                        <!-- Candidate Skills -->
                        <div class="col-12">
                            <label class="form-label">Skills</label>
                            <div class="d-flex gap-2 flex-wrap align-items-center" id="skillsContainer">

                                <!-- Render Existing Candidate Skills -->
                                <span class="pill skill-item" th:each="candidateSkill, stat : *{skills}">
                                    <span th:text="${candidateSkill.skillName}">Java</span>
                                    <small class="text-muted ms-1"
                                           th:if="${candidateSkill.experienceLevel != null}"
                                           th:text="'(' + ${#strings.capitalize(#strings.toLowerCase(candidateSkill.experienceLevel.name()))} + ')'">(Beginner)</small>

                                    <input type="hidden" class="skill-name-input"
                                           th:name="'skills[' + ${stat.index} + '].skillName'"
                                           th:value="${candidateSkill.skillName}">
                                    <input type="hidden" class="skill-level-input"
                                           th:name="'skills[' + ${stat.index} + '].experienceLevel'"
                                           th:value="${candidateSkill.experienceLevel}">

                                    <i class="bi bi-x ms-1" style="cursor: pointer;" onclick="removeSkill(this)"></i>
                                </span>

                                <!-- Input control for adding a new skill -->
                                <div id="addSkillInputGroup" class="d-none align-items-center gap-1">
                                    <input type="text" id="newSkillInput" class="form-control form-control-sm"
                                           list="skillsDatalist" placeholder="Skill name..." style="width: 140px;">

                                    <datalist id="skillsDatalist">
                                        <option th:each="skillName : ${skillsSuggestions}"
                                                th:value="${skillName}"></option>
                                    </datalist>

                                    <select id="newSkillLevelSelect" class="form-select form-select-sm"
                                            style="width: 130px;">
                                        <option th:each="lvl : ${T(com.example.jobboard.enums.SkillLevel).values()}"
                                                th:value="${lvl}"
                                                th:text="${#strings.capitalize(#strings.toLowerCase(lvl.name()))}">
                                        </option>
                                    </select>

                                    <button type="button" class="btn btn-sm btn-brass" onclick="confirmAddSkill()">Add
                                    </button>
                                    <button type="button" class="btn btn-sm btn-link text-muted p-0 ms-1"
                                            onclick="hideSkillInput()">Cancel
                                    </button>
                                </div>

                                <!-- Add Skill Trigger Button -->
                                <span id="addSkillTrigger" class="pill text-muted"
                                      style="border-style: dashed; cursor: pointer;" onclick="showSkillInput()">
                                    + Add skill
                                </span>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-3 mt-4 border-top">
                        <a th:href="@{/candidate/dashboard}" class="btn btn-outline-ink btn-sm">Cancel</a>
                        <button type="submit" class="btn btn-brass btn-sm">
                            <i class="bi bi-check-circle me-1"></i> Save changes
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </div>
</section>

<div th:replace="fragments/footer :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/script.js}"></script>
<script>
    function showSkillInput() {
        document.getElementById('addSkillTrigger').classList.add('d-none');
        const inputGroup = document.getElementById('addSkillInputGroup');
        inputGroup.classList.remove('d-none');
        inputGroup.classList.add('d-inline-flex');
        document.getElementById('newSkillInput').focus();
    }

    function hideSkillInput() {
        const inputGroup = document.getElementById('addSkillInputGroup');
        inputGroup.classList.remove('d-inline-flex');
        inputGroup.classList.add('d-none');
        document.getElementById('addSkillTrigger').classList.remove('d-none');
        document.getElementById('newSkillInput').value = '';
    }

    function confirmAddSkill() {
        const input = document.getElementById('newSkillInput');
        const levelSelect = document.getElementById('newSkillLevelSelect');
        const skillName = input.value.trim();
        const skillLevel = levelSelect.value;

        if (!skillName) return;

        const container = document.getElementById('skillsContainer');
        const trigger = document.getElementById('addSkillTrigger');

        const formattedLevel = skillLevel.charAt(0).toUpperCase() + skillLevel.slice(1).toLowerCase();

        const pill = document.createElement('span');
        pill.className = 'pill skill-item';
        pill.innerHTML = `
            <span>${skillName}</span>
            <small class="text-muted ms-1">(${formattedLevel})</small>
            <input type="hidden" class="skill-name-input" value="${skillName}">
            <input type="hidden" class="skill-level-input" value="${skillLevel}">
            <i class="bi bi-x ms-1" style="cursor: pointer;" onclick="removeSkill(this)"></i>
        `;

        container.insertBefore(pill, trigger);
        reindexSkills();
        hideSkillInput();
    }

    function removeSkill(element) {
        element.closest('.skill-item').remove();
        reindexSkills();
    }

    function reindexSkills() {
        const skillItems = document.querySelectorAll('.skill-item');
        skillItems.forEach((item, index) => {
            const nameInput = item.querySelector('.skill-name-input');
            const levelInput = item.querySelector('.skill-level-input');
            if (nameInput) {
                nameInput.setAttribute('name', `skills[${index}].skillName`);
            }
            if (levelInput) {
                levelInput.setAttribute('name', `skills[${index}].experienceLevel`);
            }
        });
    }
</script>
</body>
</html>
