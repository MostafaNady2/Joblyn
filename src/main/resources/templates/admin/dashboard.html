<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard — Joblyn</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;1,600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>



<!-- ===== Navbar ===== -->
<nav class="navbar navbar-expand-lg rj-navbar py-2">
    <div class="container">

        <!-- Left side - Project name -->
        <a class="navbar-brand text-white fw-bold fs-4 text-decoration-none"
           th:href="@{/}">
            Joblyn
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item"><a class="nav-link active" th:href="@{/admin/dashboard}">dashboard</a></li>
            </ul>
        </div>

        <div class="d-flex align-items-center">
            <a sec:authorize="hasRole('ADMIN')"
               th:href="@{/admin/dashboard}"
               class="text-decoration-none"
               title="Dashboard"
               style="width: 38px; height: 38px;">
                <img th:src="@{${image}}"
                     alt="Profile Photo"
                     class="rounded-circle border border-2 border-light"
                     width="38"
                     height="38"
                     style="object-fit: cover;">
            </a>
        </div>
    </div>
</nav>

<section class="container py-5">
    <div class="dash-shell">

        <!-- Sidebar -->
        <aside class="dash-side">
            <span class="who">Signed in as</span>
            <div class="name" sec:authentication="name">Admin</div>

            <ul class="nav flex-column mt-3">
                <li class="nav-item">
                    <a class="nav-link active d-flex align-items-center justify-content-between" href="/admin/dashboard">
                        <span><i class="bi bi-hourglass-split me-2"></i> Review queue</span>
                        <span class="badge rounded-pill bg-light text-dark border ms-2"
                              th:text="${pendingCount != null ? pendingCount : 0}">0</span>
                    </a>

                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/admin/jobs">
                        <i class="bi bi-briefcase me-2"></i> All jobs
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/admin/users">
                        <i class="bi bi-people me-2"></i> Users
                    </a>
                </li>
            </ul>

            <hr>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="nav-link border-0 bg-transparent p-0 text-start w-100">
                    <i class="bi bi-box-arrow-right me-2"></i> Log out
                </button>
            </form>
        </aside>

        <!-- Main Content -->
        <div>
            <!-- Stats -->
            <div class="row g-3 mb-5">
                <div class="col-sm-3">
                    <div class="stat-card">
                        <div class="d-flex justify-content-between">
                            <div>
                                <div class="num" th:text="${pendingCount != null ? pendingCount : 0}">0</div>
                                <div class="label">Pending review</div>
                            </div>
                            <i class="bi bi-hourglass-split text-muted fs-4"></i>
                        </div>
                    </div>
                </div>
                <div class="col-sm-3">
                    <div class="stat-card">
                        <div class="d-flex justify-content-between">
                            <div>
                                <div class="num" th:text="${publishedCount != null ? publishedCount : 0}">0</div>
                                <div class="label">Published</div>
                            </div>
                            <i class="bi bi-check-circle text-muted fs-4"></i>
                        </div>
                    </div>
                </div>
                <div class="col-sm-3">
                    <div class="stat-card">
                        <div class="d-flex justify-content-between">
                            <div>
                                <div class="num" th:text="${rejectedCount != null ? rejectedCount : 0}">0</div>
                                <div class="label">Rejected</div>
                            </div>
                            <i class="bi bi-x-circle text-muted fs-4"></i>
                        </div>
                    </div>
                </div>
                <div class="col-sm-3">
                    <div class="stat-card">
                        <div class="d-flex justify-content-between">
                            <div>
                                <div class="num" th:text="${employersCount != null ? employersCount : 0}">0</div>
                                <div class="label">Employers</div>
                            </div>
                            <i class="bi bi-building text-muted fs-4"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Review Queue -->
            <div id="queue" class="mb-5">
                <div class="section-head">
                    <h2>Review queue</h2>
                    <span class="text-muted small"
                          th:text="${pendingJobs != null ? pendingJobs.size() + ' jobs waiting' : '0 jobs waiting'}">
                        0 jobs waiting
                    </span>
                </div>

                <div class="panel panel-tight p-0 overflow-hidden">
                    <table class="ledger-table mb-0">
                        <thead>
                        <tr>
                            <th>Role</th>
                            <th>Employer</th>
                            <th>Posted</th>
                            <th>Status</th>
                            <th class="text-end">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="job : ${pendingJobs}">
                            <td>
                                <strong th:text="${job.title}">Role Title</strong>
                                <div class="text-muted small">
                                    <span th:if="${job.location != null}"
                                          th:text="${job.location.city + ', ' + job.location.country}">Location</span>
                                    <span th:if="${job.workNature != null}"
                                          th:text="' · ' + ${#strings.capitalize(#strings.toLowerCase(#strings.replace(job.workNature.name(), '_', ' ')))}"></span>
                                    <span th:if="${job.salary != null}"
                                          th:text="' · $' + ${#numbers.formatInteger(job.salary, 1, 'COMMA')} + '/yr'"></span>
                                </div>
                            </td>
                            <td th:text="${job.employer != null ? job.employer.companyName : 'N/A'}">Employer</td>
                            <td th:text="${job.postedAt != null ? #temporals.format(job.postedAt, 'MMM d, yyyy') : 'N/A'}">
                                Date
                            </td>
                            <td><span class="badge-status badge-pending">Pending</span></td>
                            <td class="text-end">
                                <form th:action="@{/admin/jobs/{id}/approve(id=${job.id})}" method="post"
                                      class="d-inline">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn btn-outline-ink btn-sm">Approve</button>
                                </form>
                                <form th:action="@{/admin/jobs/{id}/reject(id=${job.id})}" method="post"
                                      class="d-inline">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn btn-sm"
                                            style="border:1.5px solid var(--rust); color:var(--rust);">
                                        Reject
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(pendingJobs)}">
                            <td colspan="5" class="text-center text-muted py-5">
                                <i class="bi bi-check2-circle fs-3 d-block mb-2"></i>
                                No pending jobs to review.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</section>

<div th:replace="fragments/footer :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
