<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard — Joblyn</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;1,600&family=Source+Sans+3:wght@400;500;600;700&display=swap"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<!-- ===== Navbar ===== -->
<nav class="navbar navbar-expand-lg rj-navbar py-2">
    <div class="container">

        <!-- Left side - Project name -->
        <a class="navbar-brand text-white fw-bold fs-4 text-decoration-none"
           th:href="@{/}">
            Joblyn
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item"><a class="nav-link active" th:href="@{/admin/jobs}">dashboard</a></li>
            </ul>
        </div>
        <div class="d-flex align-items-center">
            <a sec:authorize="hasRole('ADMIN')"
               th:href="@{/admin/dashboard}"
               class="text-decoration-none"
               title="Dashboard"
               style="width: 38px; height: 38px;">
                <img th:src="@{${image}}"
                     alt="Profile Photo"
                     class="rounded-circle border border-2 border-light"
                     width="38"
                     height="38"
                     style="object-fit: cover;">
            </a>
        </div>
    </div>
</nav>

<section class="container py-5">
    <div class="dash-shell">

        <!-- Sidebar -->
        <aside class="dash-side">
            <span class="who">Signed in as</span>
            <div class="name" sec:authentication="name">Admin</div>

            <ul class="nav flex-column mt-3">
                <li class="nav-item">
                    <a class="nav-link" href="/admin/dashboard">
                        <i class="bi bi-hourglass-split me-2"></i> Review queue
                    </a>

                </li>
                <li class="nav-item">
                    <a class="nav-link active d-flex align-items-center justify-content-between" href="/admin/users">
                        <span><i class="bi bi-briefcase me-2"></i> All jobs</span>
                        <span class="badge rounded-pill bg-light text-dark border ms-2"
                              th:text="${jobs != null ? jobs.content.size() : 0}">0</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/admin/users">
                        <i class="bi bi-people me-2"></i> Users
                    </a>

                </li>
            </ul>

            <hr>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="nav-link border-0 bg-transparent p-0 text-start w-100">
                    <i class="bi bi-box-arrow-right me-2"></i> Log out
                </button>
            </form>
        </aside>

        <!-- Main Content -->
        <div>
            <!-- All Jobs -->
            <div id="all-jobs" class="mb-5">
                <div class="section-head">
                    <h2>All jobs</h2>
                </div>
                <div class="panel panel-tight p-0 overflow-hidden">
                    <table class="ledger-table mb-0">
                        <thead>
                        <tr>
                            <th>Role</th>
                            <th>Employer</th>
                            <th>Posted</th>
                            <th>Status</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="job : ${jobs.content}">
                            <td th:text="${job.title}">Role Title</td>
                            <td th:text="${job.employer != null ? job.employer.companyName : 'N/A'}">Employer</td>
                            <td th:text="${job.postedAt != null ? #temporals.format(job.postedAt, 'MMM d, yyyy') : 'N/A'}">
                                Date
                            </td>
                            <td>
                                <span th:class="'badge-status ' + ${job.status != null ?
                                      (job.status.name() == 'OPEN' ? 'badge-published' :
                                      (job.status.name() == 'CLOSED' ? 'badge-rejected' : 'badge-pending'))
                                      : 'badge-pending'}"
                                      th:text="${job.status != null ? #strings.capitalize(#strings.toLowerCase(job.status.name())) : 'Pending'}">
                                    Status
                                </span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(jobs.content)}">
                            <td colspan="4" class="text-center text-muted py-4">No jobs found.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <!-- ===== Pagination Controls ===== -->
                <nav th:if="${jobs.totalPages > 1}" aria-label="Job pagination" class="mt-5 mb-4">
                    <ul class="pagination pagination-rounded justify-content-center align-items-center gap-2">

                        <!-- Previous Page -->
                        <li class="page-item" th:classappend="${jobs.first} ? 'disabled'">
                            <a class="page-link rounded-circle d-flex align-items-center justify-content-center"
                               th:href="@{/admin/jobs(page=${jobs.number - 1})}"
                               aria-label="Previous">
                                <i class="bi bi-chevron-left small"></i>
                            </a>
                        </li>

                        <!-- Page Numbers -->
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, jobs.totalPages - 1)}"
                            th:classappend="${i == jobs.number} ? 'active'">
                            <a class="page-link rounded-circle d-flex align-items-center justify-content-center"
                               th:href="@{/admin/jobs(page=${i})}"
                               th:text="${i + 1}">1</a>
                        </li>

                        <!-- Next Page -->
                        <li class="page-item" th:classappend="${jobs.last} ? 'disabled'">
                            <a class="page-link rounded-circle d-flex align-items-center justify-content-center"
                               th:href="@{/admin/jobs(page=${jobs.number + 1})}"
                               aria-label="Next">
                                <i class="bi bi-chevron-right small"></i>
                            </a>
                        </li>

                    </ul>
                </nav>

            </div>

        </div>

    </div>
</section>

<div th:replace="fragments/footer :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
