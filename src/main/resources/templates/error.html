<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${status} + ' - ' + ${error} + ' — Joblyn'">Error — Joblyn</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;1,600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

<main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6 text-center">
                <div class="mb-4">
                    <i class="bi bi-exclamation-triangle text-warning display-1"></i>
                </div>
                <h1 class="display-4 fw-bold mb-2" th:text="${status}">404</h1>
                <h2 class="h4 text-muted mb-4" th:text="${error}">Not Found</h2>
                
                <div class="panel text-start mb-4">
                    <p class="mb-2"><strong>Message:</strong> <span th:text="${message}">Something went wrong</span></p>
                    <p class="mb-2"><strong>Path:</strong> <code th:text="${path}">/some/path</code></p>
                    <p class="mb-0 text-muted small"><strong>Time:</strong> <span th:text="${#temporals.format(timestamp, 'yyyy-MM-dd HH:mm:ss')}">2026-09-17 12:08:00</span></p>
                </div>

                <div class="d-flex gap-3 justify-content-center">
                    <a href="/" class="btn btn-brass">
                        <i class="bi bi-house-door me-2"></i>Back to Home
                    </a>
                    <button onclick="history.back()" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-2"></i>Go Back
                    </button>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
