<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Log in — Joblyn</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;1,600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<!-- ===== Navbar ===== -->
<nav class="navbar navbar-expand-lg rj-navbar py-2">
    <div class="container">

        <!-- Left side - Project name -->
        <a class="navbar-brand text-white fw-bold fs-4 text-decoration-none"
           th:href="@{/}">
            Joblyn
        </a>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="panel p-4">
                <div class="text-center mb-4">
                    <h1 class="h3 mb-1">Welcome back</h1>
                    <p class="text-muted small mb-0">Log in to continue to Joblyn</p>
                </div>

                <!-- Alerts -->
                <div th:if="${param.error}" class="alert alert-danger py-2 small" role="alert">
                    Invalid email or password.
                </div>
                <div th:if="${param.logout}" class="alert alert-success py-2 small" role="alert">
                    You have been logged out successfully.
                </div>

                <form th:action="@{/login}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="mb-3">
                        <label class="form-label" for="email">Email</label>
                        <input type="email"
                               class="form-control"
                               id="email"
                               name="username"
                               placeholder="you@example.com"
                               required
                               autofocus>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="password">Password</label>
                        <input type="password"
                               class="form-control"
                               id="password"
                               name="password"
                               placeholder="••••••••"
                               required>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="remember-me" name="remember-me">
                            <label class="form-check-label small" for="remember-me">Remember me</label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-brass w-100 mb-3">Log in</button>
                </form>

                <p class="text-center text-muted small mb-0">
                New to Joblyn? <a th:href="@{/register(role='candidate')}">Create an account</a>
                </p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
